<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Recuerdo oculto</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:linear-gradient(145deg,#101827,#283656);font-family:Arial,sans-serif;color:white;display:flex;justify-content:center;align-items:center}
  .card{width:100%;max-width:430px;overflow:hidden;text-align:center;background:#ffffff12;padding:22px;border-radius:24px;box-shadow:0 20px 50px #0006}h1{margin:0 0 8px}.sub{color:#dbe5ff;line-height:1.45}
  .marco{
    position:relative;
    width:100%;
    max-width:320px;
         aspect-ratio:1;margin:18px auto;border-radius:18px;overflow:hidden;border:3px solid #ffffff55}.marco img,.marco canvas{position:absolute;inset:0;width:100%;height:100%}.marco img{object-fit:cover}.marco canvas{touch-action:none}#mensaje{display:none;margin-top:16px;padding:16px;border-radius:14px;background:#fff2b5;color:#5b4700;font-weight:bold}
</style></head><body><main class="card"><h1>🌫️ Recuerdo oculto</h1><p class="sub">El tiempo ha cubierto este recuerdo.<br>Pasa el dedo para recuperarlo.</p><div class="marco"><img src="foto.jpg" alt="Recuerdo oculto"><canvas id="niebla"></canvas></div><div id="mensaje">✨ RECUERDO RECUPERADO ✨</div>
</main><script>
const canvas=document.getElementById('niebla'),ctx=canvas.getContext('2d');let borrando=false,comprobaciones=0;
function preparar(){const r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*devicePixelRatio);canvas.height=Math.round(r.height*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);const g=ctx.createLinearGradient(0,0,r.width,r.height);g.addColorStop(0,'#dce4ef');g.addColorStop(.5,'#8f9bad');g.addColorStop(1,'#c8d0dc');ctx.globalCompositeOperation='source-over';ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);ctx.fillStyle='#ffffff55';for(let i=0;i<80;i++){ctx.beginPath();ctx.arc(Math.random()*r.width,Math.random()*r.height,8+Math.random()*28,0,Math.PI*2);ctx.fill()}document.getElementById('mensaje').style.display='none'}
function punto(e){const r=canvas.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}}
function borrar(e){if(!borrando)return;e.preventDefault();const p=punto(e);ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(p.x,p.y,30,0,Math.PI*2);ctx.fill();if(++comprobaciones%12===0)comprobar()}
function comprobar(){const d=ctx.getImageData(0,0,canvas.width,canvas.height).data;let transparentes=0;for(let i=3;i<d.length;i+=40)if(d[i]<40)transparentes++;if(transparentes/(d.length/40)>.55){canvas.style.pointerEvents='none';document.getElementById('mensaje').style.display='block'}}
['pointerdown'].forEach(n=>canvas.addEventListener(n,e=>{borrando=true;borrar(e)}));canvas.addEventListener('pointermove',borrar);window.addEventListener('pointerup',()=>borrando=false);window.addEventListener('resize',preparar);window.addEventListener('load',preparar);
</script></body></html>
