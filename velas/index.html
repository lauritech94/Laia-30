<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Velas</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{

    background:
    radial-gradient(
        circle,
        #1a2338,
        #090d18
    );

}

#juego{

    position:relative;

    width:100vw;
    height:100vh;
}

.vela{

    position:absolute;

    width:46px;
    height:90px;

    transform:
    translate(-50%,-50%);
}

.cera{

    position:absolute;

    bottom:0;

    width:46px;
    height:70px;

    border-radius:10px;

    background:
    linear-gradient(
        #f6f4ea,
        #ddd6b8
    );
}

.llama{

    position:absolute;

    left:50%;
    top:-25px;

    width:22px;
    height:32px;

    transform:
    translateX(-50%);

    border-radius:
    50% 50% 50% 50%;

    background:
    radial-gradient(
        circle at 40% 30%,
        #fff,
        #ffe66d 35%,
        #ff9f43 70%,
        #ff6b00
    );

    box-shadow:
    0 0 12px #ffe66d,
    0 0 30px #ff9f43;

    display:none;
}

.encendida .llama{
    display:block;
}

#cable{

    position:absolute;
    inset:0;

    pointer-events:none;
}

#final{

    position:absolute;

    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    opacity:0;

    transition:.7s;

    pointer-events:none;
}

#final.mostrar{

    opacity:1;
}

#orb{

    width:140px;
    height:140px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        white,
        #ffe66d,
        #ff9f43
    );

    box-shadow:
    0 0 40px #ffe66d,
    0 0 90px #ff9f43;
}

</style>
</head>

<body>

<div id="juego">

<svg id="cable"></svg>

<div class="vela encendida" style="left:20%;top:70%;"></div>

<div class="vela" style="left:45%;top:25%;"></div>

<div class="vela" style="left:75%;top:30%;"></div>

<div class="vela" style="left:80%;top:65%;"></div>

<div class="vela" style="left:50%;top:80%;"></div>

<div class="vela" style="left:25%;top:40%;"></div>

<div id="final">
    <div id="orb"></div>
</div>

</div>

document.querySelectorAll(".vela");

    v.innerHTML=

        x:r.left+r.width/2,

        y:r.top+r.height/2-35

    };

    const vela =

        vela &&
        vela.classList.contains(
        "encendida"
        )
    ){

        arrastrando=true;

        origen=vela;

    }

});

"pointerup",

    arrastrando=false;

    svg.innerHTML="";
