<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velas V2</title>

<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#111827;
}

#juego{
position:relative;
width:100vw;
height:100vh;
}

.vela{
position:absolute;
width:60px;
height:100px;
transform:translate(-50%,-50%);
}

.cera{
position:absolute;
bottom:0;
width:60px;
height:80px;
border-radius:12px;
background:white;
border:2px solid #d4d4d4;
}

.llama{
position:absolute;
top:-30px;
left:50%;
transform:translateX(-50%);
width:24px;
height:36px;
border-radius:50%;
background:orange;
box-shadow:0 0 30px orange;
display:none;
}

.encendida .llama{
display:block;
}

#linea{
position:absolute;
left:0;
top:0;
width:100%;
height:100%;
pointer-events:none;
}

#final{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
opacity:0;
transition:.4s;
pointer-events:none;
}

#final.mostrar{
opacity:1;
}

#orb{
width:140px;
height:140px;
border-radius:50%;
background:gold;
box-shadow:0 0 60px gold;
}

</style>
</head>

<body>

<div id="juego">

<svg id="linea"></svg>

<div class="vela encendida" style="left:15%;top:70%;">
<div class="llama"></div>
<div class="cera"></div>
</div>

<div class="vela" style="left:35%;top:35%;">
<div class="llama"></div>
<div class="cera"></div>
</div>

<div class="vela" style="left:60%;top:20%;">
<div class="llama"></div>
<div class="cera"></div>
</div>

<div class="vela" style="left:82%;top:40%;">
<div class="llama"></div>
<div class="cera"></div>
</div>

<div class="vela" style="left:78%;top:75%;">
<div class="llama"></div>
<div class="cera"></div>
</div>

<div class="vela" style="left:45%;top:82%;">
<div class="llama"></div>
<div class="cera"></div>
</div>

<div id="final">
<div id="orb"></div>
</div>

</div>

<script>

const velas=document.querySelectorAll(".vela");
const linea=document.getElementById("linea");
const final=document.getElementById("final");

let activa=null;
let arrastrando=false;

function centro(v){

const r=v.getBoundingClientRect();

return{
x:r.left+r.width/2,
y:r.top
};

}

document.addEventListener("pointerdown",e=>{

const vela=e.target.closest(".vela");

if(
vela &&
vela.classList.contains("encendida")
){

activa=vela;
arrastrando=true;

}

});

document.addEventListener("pointerup",()=>{

arrastrando=false;
linea.innerHTML="";

});

document.addEventListener("pointermove",e=>{

if(!arrastrando)return;

const p=centro(activa);

linea.innerHTML=
`<line
x1="${p.x}"
y1="${p.y}"
x2="${e.clientX}"
y2="${e.clientY}"
stroke="gold"
stroke-width="6"
stroke-linecap="round"
/>`;

velas.forEach(v=>{

if(v.classList.contains("encendida"))
return;

const c=centro(v);

const d=Math.hypot(
e.clientX-c.x,
e.clientY-c.y
);

if(d<45){

v.classList.add("encendida");

comprobar();

}

});

});

function comprobar(){

const total=velas.length;

const on=
document.querySelectorAll(
".vela.encendida"
).length;

if(total===on){

final.classList.add(
"mostrar"
);

}

}

</script>

</body>
</html>
