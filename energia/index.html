<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esfera Energía V2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f172a;min-height:100vh;display:flex;justify-content:center;align-items:center;overflow:hidden}
.contenedor{position:relative;width:320px;height:320px}
.esfera{position:absolute;left:50px;top:50px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff,#8f8f8f,#3b3b3b);box-shadow:0 0 10px rgba(255,255,255,.15);touch-action:none;z-index:2}
.fragmento{position:absolute;width:22px;height:22px;background:rgba(255,255,255,.95);clip-path:polygon(50% 0%,100% 35%,85% 100%,15% 100%,0% 35%);pointer-events:none}
#contenido{position:absolute;left:50px;top:50px;width:220px;height:220px;border-radius:20px;background:white;opacity:0;transform:scale(.6);transition:.5s;display:flex;align-items:center;justify-content:center;font-size:60px}
</style>
</head>
<body>
<div class="contenedor">
<div id="contenido">🔑</div>
<div id="esfera" class="esfera"></div>
</div>
<script>
let energia=0,pulsando=false,fin=false;
const esfera=document.getElementById('esfera');
const contenido=document.getElementById('contenido');
const cont=document.querySelector('.contenedor');
esfera.addEventListener('pointerdown',()=>pulsando=true);
window.addEventListener('pointerup',()=>pulsando=false);
window.addEventListener('pointercancel',()=>pulsando=false);
function explosion(){
 for(let i=0;i<35;i++){
  const f=document.createElement('div');
  f.className='fragmento';
  f.style.left='150px';
  f.style.top='150px';
  cont.appendChild(f);
  const a=Math.random()*Math.PI*2;
  const d=100+Math.random()*130;
  const x=Math.cos(a)*d;
  const y=Math.sin(a)*d;
  f.animate([{opacity:1,transform:'translate(0,0) rotate(0deg)'},{opacity:0,transform:`translate(${x}px,${y}px) rotate(${720+Math.random()*720}deg)`}],{duration:900,easing:'ease-out',fill:'forwards'});
 }
}
setInterval(()=>{
 if(fin)return;
 energia += pulsando ? 0.65 : -0.18;
 if(energia<0)energia=0;
 if(energia>100)energia=100;
 const glow=10+energia*1.5;
 const scale=1+energia/350;
 const shake=energia>80?(Math.random()*6-3):0;
 esfera.style.transform=`translateX(${shake}px) scale(${scale})`;
 esfera.style.boxShadow=`0 0 ${glow}px rgba(255,220,140,.95)`;
 esfera.style.background=`radial-gradient(circle at 30% 30%, white, rgb(${120+energia},${120+energia/2},150), rgb(${50+energia/6},${50+energia/8},80))`;
 if(energia>=100){
   fin=true;
   explosion();
   esfera.animate([{transform:'scale(1.2)'},{transform:'scale(1.5)',opacity:1},{opacity:0}],{duration:350,fill:'forwards'});
   setTimeout(()=>{contenido.style.opacity='1';contenido.style.transform='scale(1)';},300);
 }
},20);
</script>
</body>
</html>
