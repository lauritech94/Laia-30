<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Esfera de energía</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#101827;
    font-family:Arial,sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
}

.card{
    text-align:center;
}

.esfera{

    width:180px;
    height:180px;

    border-radius:50%;

    margin:auto;

    background:
    radial-gradient(circle at 30% 30%,
    #ffffff,
    #7a7a7a,
    #3a3a3a);

    box-shadow:
    0 0 20px rgba(255,255,255,.2);

    transition:.1s;
}

.barra{

    width:250px;
    height:18px;

    background:#333;

    border-radius:999px;

    overflow:hidden;

    margin-top:30px;
}

.progreso{

    width:0%;

    height:100%;

    background:
    linear-gradient(
    90deg,
    #9b59ff,
    #00d4ff,
    #ffe66d
    );

    transition:.05s;
}

#texto{

    margin-top:20px;

    font-size:20px;
    font-weight:bold;
}

.completa{

    background:
    radial-gradient(circle at 30% 30%,
    #fff9ae,
    #ffe66d,
    #ffb300);

    box-shadow:
    0 0 15px #ffe66d,
    0 0 40px #ffe66d,
    0 0 90px #ffe66d;

    transform:scale(1.15);
}

</style>
</head>

<body>

<div class="card">

<div id="esfera" class="esfera"></div>

<div class="barra">
<div id="progreso" class="progreso"></div>
</div>

<div id="texto">

MANTÉN PULSADO

</div>

</div>

<script>

let pulsando = false;

let energia = 0;

const esfera =
document.getElementById("esfera");

const progreso =
document.getElementById("progreso");

const texto =
document.getElementById("texto");

function actualizar(){

    progreso.style.width =
        energia + "%";

    if(energia >= 100){

        esfera.classList.add("completa");

        texto.innerHTML =
        "RECUERDO ESTABILIZADO";

    }

}

setInterval(()=>{

    if(pulsando){

        if(energia < 100){

            energia += 1;

        }

    }else{

        if(energia > 0){

            energia -= .5;

        }

    }

    actualizar();

},20);

esfera.addEventListener(
"pointerdown",
()=>{

    pulsando = true;

});

window.addEventListener(
"pointerup",
()=>{

    pulsando = false;

});

</script>

</body>
</html>
