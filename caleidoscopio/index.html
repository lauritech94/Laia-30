<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caleidoscopio por anillos</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  overflow:hidden;
  background:radial-gradient(circle,#293b5d 0%,#101827 65%,#080d16 100%);
  touch-action:manipulation;
}
body{min-height:100vh;display:grid;place-items:center;padding:18px}
#juego{
  position:relative;
  width:min(90vw,390px);
  aspect-ratio:1;
  border-radius:50%;
  background:#101827;
  box-shadow:0 20px 60px #000b,0 0 0 8px #ffffff12,0 0 45px #7c3aed55;
}

.anillo{
  position:absolute;
  left:50%;
  top:50%;
  border-radius:50%;
  cursor:pointer;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:transform .26s cubic-bezier(.2,.8,.2,1),filter .2s,opacity .5s;
  transform:translate(-50%,-50%) rotate(var(--rot));
  background-image:url("foto.jpg");
  background-size:var(--foto-size) var(--foto-size);
  background-position:center;
  background-repeat:no-repeat;
}

#exterior{
  --foto-size:100% 100%;
  width:100%;
  height:100%;
  z-index:2;
  -webkit-mask:radial-gradient(circle,transparent 0 35%,#000 35.8% 100%);
  mask:radial-gradient(circle,transparent 0 35%,#000 35.8% 100%);
}

#medio{
  --foto-size:143% 143%;
  width:70%;
  height:70%;
  z-index:4;
  -webkit-mask:radial-gradient(circle,transparent 0 42%,#000 43% 100%);
  mask:radial-gradient(circle,transparent 0 42%,#000 43% 100%);
}

#interior{
  --foto-size:250% 250%;
  width:40%;
  height:40%;
  z-index:6;
}

.borde{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:3px solid rgba(255,255,255,.45);
  box-shadow:0 0 10px rgba(255,255,255,.18);
  pointer-events:none;
  z-index:8;
}
.b1{width:100%;height:100%}
.b2{width:70%;height:70%}
.b3{width:40%;height:40%}

.marca{
  position:absolute;
  left:50%;
  top:-4px;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-top:25px solid #ffe66d;
  filter:drop-shadow(0 0 7px #ffe66d);
  z-index:15;
  pointer-events:none;
}

.zona{
  position:absolute;
  width:50%;
  height:100%;
  top:0;
  z-index:11;
  background:transparent;
  border:0;
  padding:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.izq{left:0}
.der{right:0}

.control{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  z-index:12;
}
#controlExterior{width:100%;height:100%}
#controlMedio{width:70%;height:70%}
#controlInterior{width:40%;height:40%}

.encajado{filter:drop-shadow(0 0 16px #ffe66d) brightness(1.15)}

#revelado{
  position:absolute;
  inset:0;
  border-radius:50%;
  opacity:0;
  transform:scale(.55);
  z-index:20;
  background:url("foto.jpg") center/cover no-repeat;
  pointer-events:none;
  box-shadow:inset 0 0 35px #fff5,0 0 55px #ffe66d88;
}
#flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:99}

.resuelto .anillo{animation:salir .72s ease forwards}
.resuelto #revelado{animation:revelar .85s .2s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes salir{to{opacity:0;transform:translate(-50%,-50%) rotate(160deg) scale(1.35)}}
@keyframes revelar{0%{opacity:0;transform:scale(.55)}65%{opacity:1;transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div id="juego">
  <div id="exterior" class="anillo"></div>
  <div id="medio" class="anillo"></div>
  <div id="interior" class="anillo"></div>

  <div class="borde b1"></div>
  <div class="borde b2"></div>
  <div class="borde b3"></div>
  <div class="marca"></div>

  <div id="controlExterior" class="control">
    <button class="zona izq" aria-label="Exterior izquierda"></button>
    <button class="zona der" aria-label="Exterior derecha"></button>
  </div>
  <div id="controlMedio" class="control">
    <button class="zona izq" aria-label="Medio izquierda"></button>
    <button class="zona der" aria-label="Medio derecha"></button>
  </div>
  <div id="controlInterior" class="control">
    <button class="zona izq" aria-label="Interior izquierda"></button>
    <button class="zona der" aria-label="Interior derecha"></button>
  </div>

  <div id="revelado"></div>
</div>
<div id="flash"></div>

<script>
const juego=document.getElementById('juego');
const capas=[
  {el:document.getElementById('exterior'),control:document.getElementById('controlExterior'),pasos:8,pos:3},
  {el:document.getElementById('medio'),control:document.getElementById('controlMedio'),pasos:8,pos:6},
  {el:document.getElementById('interior'),control:document.getElementById('controlInterior'),pasos:8,pos:2}
];
let resuelto=false;

function normalizar(n,p){return((n%p)+p)%p}

function pintar(){
  capas.forEach(c=>{
    const angulo=normalizar(c.pos,c.pasos)*(360/c.pasos);
    c.el.style.setProperty('--rot',`${angulo}deg`);
    c.el.classList.toggle('encajado',normalizar(c.pos,c.pasos)===0);
  });

  if(capas.every(c=>normalizar(c.pos,c.pasos)===0)&&!resuelto){
    resuelto=true;
    juego.classList.add('resuelto');
    document.getElementById('flash').animate(
      [{opacity:0},{opacity:.9},{opacity:0}],
      {duration:550}
    );
    if(navigator.vibrate)navigator.vibrate([45,30,90]);
  }
}

capas.forEach(c=>{
  const izquierda=c.control.querySelector('.izq');
  const derecha=c.control.querySelector('.der');

  izquierda.addEventListener('pointerdown',e=>{
    if(resuelto)return;
    e.preventDefault();e.stopPropagation();
    c.pos--;
    pintar();
  });

  derecha.addEventListener('pointerdown',e=>{
    if(resuelto)return;
    e.preventDefault();e.stopPropagation();
    c.pos++;
    pintar();
  });
});

pintar();
</script>
</body>
</html>
