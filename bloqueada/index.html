<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Esfera bloqueada</title>

<style>

body{
    margin:0;
    background:#0f172a;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    font-family:Arial;
}

#esfera{

    width:320px;
    height:320px;

    position:relative;
}

.anillo{

    position:absolute;

    border-radius:50%;

    border:10px solid rgba(255,255,255,.25);

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;

    font-weight:bold;

    user-select:none;

}

#a1{
    width:300px;
    height:300px;
    top:10px;
    left:10px;
}

#a2{
    width:230px;
    height:230px;
    top:45px;
    left:45px;
}

#a3{
    width:160px;
    height:160px;
    top:80px;
    left:80px;
}

.marca{

    position:absolute;

    top:-10px;
    left:50%;

    transform:translateX(-50%);

    width:16px;
    height:16px;

    border-radius:50%;

    background:#ffe66d;
}

#abierto{

    position:absolute;

    inset:0;

    border-radius:50%;

    background:white;

    color:black;

    display:none;

    justify-content:center;
    align-items:center;

    font-size:50px;
}

</style>
</head>

<body>

<div id="esfera">

    <div id="a1" class="anillo">
        <div class="marca"></div>
    </div>

    <div id="a2" class="anillo">
        <div class="marca"></div>
    </div>

    <div id="a3" class="anillo">
        <div class="marca"></div>
    </div>

    <div id="abierto">
        🔑
    </div>

</div>

<script>

const simbolos = [
    "⭐",
    "🛵",
    "🐧",
    "❤️",
    "🧶",
    "🎨"
];

const objetivo1 = "🛵";
const objetivo2 = "🐧";
const objetivo3 = "❤️";

let i1 = 0;
let i2 = 1;
let i3 = 2;

const a1 =
document.getElementById("a1");

const a2 =
document.getElementById("a2");

const a3 =
document.getElementById("a3");

function render(anillo, indice){

    const actual =
        simbolos[indice];

    anillo.innerHTML =
    `
    <div class="marca"></div>
    <div style="
        position:absolute;
        top:15px;
        left:50%;
        transform:translateX(-50%);
        font-size:34px;
    ">
        ${actual}
    </div>
    `;

}

function comprobar(){

    const ok1 =
        simbolos[i1] === objetivo1;

    const ok2 =
        simbolos[i2] === objetivo2;

    const ok3 =
        simbolos[i3] === objetivo3;

    if(ok1 && ok2 && ok3){

        document
        .getElementById("abierto")
        .style.display =
        "flex";

        document
        .getElementById("abierto")
        .animate(

        [
            {
                transform:"scale(.5)",
                opacity:0
            },

            {
                transform:"scale(1)",
                opacity:1
            }

        ],

        {
            duration:500,
            fill:"forwards"
        });

    }

}

function pintar(){

    render(a1,i1);
    render(a2,i2);
    render(a3,i3);

    comprobar();

}

a1.onclick = ()=>{

    i1++;

    if(i1 >= simbolos.length)
        i1 = 0;

    pintar();

};

a2.onclick = ()=>{

    i2++;

    if(i2 >= simbolos.length)
        i2 = 0;

    pintar();

};

a3.onclick = ()=>{

    i3++;

    if(i3 >= simbolos.length)
        i3 = 0;

    pintar();

};

pintar();

</script>

    #abierto{

    position:absolute;

    inset:0;

    border-radius:50%;

    display:none;

    justify-content:center;
    align-items:center;

    background:white;

    font-size:60px;

    z-index:100;
}

</body>
</html>
