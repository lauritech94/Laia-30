<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipo de balanza</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 38%,#293a59,#0b1220 72%);font-family:Arial,sans-serif;touch-action:none}
#juego{position:relative;width:min(96vw,470px);height:min(94vh,740px);min-height:590px;margin:auto;top:50%;transform:translateY(-50%)}
#balanza{position:absolute;left:50%;top:36%;width:390px;height:270px;transform:translate(-50%,-50%)}
#poste{position:absolute;left:50%;top:48px;width:18px;height:190px;transform:translateX(-50%);border-radius:10px;background:linear-gradient(90deg,#76839b,#dce7f5,#65728a);box-shadow:0 8px 20px #0007}
#base{position:absolute;left:50%;bottom:10px;width:170px;height:28px;transform:translateX(-50%);border-radius:50%;background:linear-gradient(#aab7cb,#556278);box-shadow:0 10px 18px #0008}
#pivote{position:absolute;left:50%;top:36px;width:48px;height:48px;transform:translateX(-50%);border-radius:50%;z-index:8;background:radial-gradient(circle at 35% 30%,#fff,#f6cc5d 35%,#a66d11);box-shadow:0 0 17px #ffd76b88}
#brazo{position:absolute;left:50%;top:56px;width:340px;height:15px;transform:translateX(-50%) rotate(0deg);transform-origin:center;z-index:6;border-radius:10px;background:linear-gradient(#dce7f5,#65728a);box-shadow:0 5px 12px #0006;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.cuerda{position:absolute;top:7px;width:3px;height:78px;background:#bfccdf}.c1{left:18px}.c2{right:18px}
.plato{position:absolute;top:77px;width:132px;height:58px;border-radius:0 0 70px 70px;background:linear-gradient(#eaf2ff,#8997ad);box-shadow:inset 0 -12px 14px #526076aa,0 10px 16px #0005;display:flex;align-items:flex-end;justify-content:center;gap:3px;padding:0 7px 9px}.izq{left:-41px}.der{right:-41px}
.objeto{position:absolute;width:66px;height:66px;border:0;border-radius:17px;background:linear-gradient(145deg,#fff,#dce5f2);box-shadow:0 9px 20px #0007;font-size:34px;display:grid;place-items:center;cursor:grab;user-select:none;touch-action:none;transform:translate(-50%,-50%);z-index:20;-webkit-tap-highlight-color:transparent}.objeto.arrastrando{cursor:grabbing;transform:translate(-50%,-50%) scale(1.1);box-shadow:0 15px 30px #0009}.objeto.colocado{position:relative;left:auto!important;top:auto!important;width:48px;height:48px;transform:none;font-size:27px;border-radius:13px;box-shadow:0 4px 9px #0006;cursor:grab;flex:0 0 auto}
#o1{left:14%;top:78%}#o2{left:33%;top:86%}#o3{left:52%;top:78%}#o4{left:71%;top:86%}#o5{left:88%;top:76%}
#onda{position:absolute;left:50%;top:36%;width:240px;height:240px;transform:translate(-50%,-50%) scale(.2);border-radius:50%;border:4px solid #ffe66d;opacity:0;pointer-events:none;z-index:30}
#victoria{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;z-index:40}
#orb{width:145px;height:145px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#ffe66d 22%,#ff9f43 58%,#7c3aed);box-shadow:0 0 45px #ffe66d,0 0 115px #ff9f43aa;transform:scale(.25)}
.resuelto #balanza,.resuelto .objeto{animation:desaparecer .65s .3s forwards}.resuelto #onda{animation:onda .85s ease}.resuelto #victoria{animation:mostrar .6s .45s forwards}.resuelto #orb{animation:orb .85s .45s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes desaparecer{to{opacity:0;transform:scale(1.15)}}@keyframes onda{0%{opacity:1;transform:translate(-50%,-50%) scale(.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}@keyframes mostrar{to{opacity:1}}@keyframes orb{0%{transform:scale(.25)}65%{transform:scale(1.14)}100%{transform:scale(1)}}
@media(max-width:440px){#balanza{transform:translate(-50%,-50%) scale(.86)}}
</style>
</head>
<body>
<div id="juego">
  <div id="balanza">
    <div id="poste"></div><div id="base"></div><div id="pivote"></div>
    <div id="brazo">
      <div class="cuerda c1"></div><div id="platoIzq" class="plato izq"></div>
      <div class="cuerda c2"></div><div id="platoDer" class="plato der"></div>
    </div>
  </div>
  <button id="o1" class="objeto" data-peso="1">🍋</button>
  <button id="o2" class="objeto" data-peso="2">📘</button>
  <button id="o3" class="objeto" data-peso="3">🧸</button>
  <button id="o4" class="objeto" data-peso="4">🎁</button>
  <button id="o5" class="objeto" data-peso="5">🪨</button>
  <div id="onda"></div><div id="victoria"><div id="orb"></div></div>
</div>
<script>
const juego=document.getElementById('juego');
const brazo=document.getElementById('brazo');
const izq=document.getElementById('platoIzq');
const der=document.getElementById('platoDer');
const objetos=[...document.querySelectorAll('.objeto')];
let activa=null,dx=0,dy=0,origen=null,resuelto=false;

function peso(plato){return [...plato.querySelectorAll('.objeto')].reduce((s,o)=>s+Number(o.dataset.peso),0)}
function actualizar(){
 const a=peso(izq),b=peso(der),dif=Math.max(-18,Math.min(18,(b-a)*4));
 brazo.style.transform=`translateX(-50%) rotate(${dif}deg)`;
 if(a>0&&b>0&&a===b&&!resuelto){resuelto=true;setTimeout(()=>juego.classList.add('resuelto'),500);if(navigator.vibrate)navigator.vibrate([40,25,90])}
}
function empezar(e){
 if(resuelto)return;e.preventDefault();activa=e.currentTarget;origen=activa.parentElement.classList.contains('plato')?activa.parentElement:null;
 const r=activa.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;
 if(origen){const jr=juego.getBoundingClientRect();activa.classList.remove('colocado');juego.appendChild(activa);activa.style.left=(r.left-jr.left+r.width/2)+'px';activa.style.top=(r.top-jr.top+r.height/2)+'px'}
 activa.classList.add('arrastrando');activa.setPointerCapture(e.pointerId);actualizar();
}
function mover(e){if(!activa||resuelto)return;e.preventDefault();const jr=juego.getBoundingClientRect();activa.style.left=(e.clientX-jr.left-dx+activa.offsetWidth/2)+'px';activa.style.top=(e.clientY-jr.top-dy+activa.offsetHeight/2)+'px'}
function dentro(e,el){const r=el.getBoundingClientRect();return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom}
function soltar(e){
 if(!activa)return;e.preventDefault();const o=activa;activa=null;o.classList.remove('arrastrando');
 let destino=null;if(dentro(e,izq))destino=izq;if(dentro(e,der))destino=der;
 if(destino){o.style.left='';o.style.top='';o.classList.add('colocado');destino.appendChild(o)}
 else if(origen){o.style.left='';o.style.top='';o.classList.add('colocado');origen.appendChild(o)}
 actualizar();
}
objetos.forEach(o=>{o.addEventListener('pointerdown',empezar);o.addEventListener('pointermove',mover);o.addEventListener('pointerup',soltar);o.addEventListener('pointercancel',soltar)});
actualizar();
</script>
</body>
</html>
