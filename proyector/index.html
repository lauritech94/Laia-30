<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proyector</title>

<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

*{
    box-sizing:border-box;
}

.contenedor{
    position:relative;
    width:100vw;
    height:100vh;
}

#foto{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;
}

#canvas{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;
}

</style>
</head>

<body>

<div class="contenedor">

foto.jpg

<canvas id="canvas"></canvas>

</div>

<script>

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);

let x =
window.innerWidth / 2;

let y =
window.innerHeight / 2;

function dibujar(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle =
        "rgba(0,0,0,0.98)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.globalCompositeOperation =
        "destination-out";

    const grad =
    ctx.createRadialGradient(

        x,
        y,
        40,

        x,
        y,
        220

    );

    grad.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    grad.addColorStop(
        0.5,
        "rgba(255,255,255,0.5)"
    );

    grad.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.fillStyle = grad;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        220,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.globalCompositeOperation =
        "source-over";

}

dibujar();

window.addEventListener(
    "pointermove",
    e=>{

        x = e.clientX;
        y = e.clientY;

        dibujar();

    }
);

window.addEventListener(
    "pointerdown",
    e=>{

        x = e.clientX;
        y = e.clientY;

        dibujar();

    }
);

</script>

</body>
</html>
