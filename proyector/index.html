<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Proyector</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:black;
    min-height:100vh;
    overflow:hidden;
}

.contenedor{
    position:relative;
    width:100vw;
    height:100vh;
}

img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

#mascara{

    position:absolute;
    inset:0;

    background:black;

    pointer-events:none;

}

</style>
</head>

<body>

<div class="contenedor">

    foto.jpg

    <canvas id="mascara"></canvas>

</div>

<script>

const canvas =
document.getElementById("mascara");

const ctx =
canvas.getContext("2d");

function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

let x =
window.innerWidth/2;

let y =
window.innerHeight/2;

function dibujar(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle =
        "rgba(0,0,0,0.96)";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.globalCompositeOperation =
        "destination-out";

    const grad =
    ctx.createRadialGradient(
        x,
        y,
        20,
        x,
        y,
        130
    );

    grad.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    grad.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.fillStyle = grad;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        130,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.globalCompositeOperation =
        "source-over";

}

dibujar();

window.addEventListener(
"pointermove",
e=>{

    x = e.clientX;
    y = e.clientY;

    dibujar();

});

window.addEventListener(
"pointerdown",
e=>{

    x = e.clientX;
    y = e.clientY;

    dibujar();

});

</script>

</body>
</html>
