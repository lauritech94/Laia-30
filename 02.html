<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esfera 02 - El Carnaval Olvidado</title>

<style>
:root{
  --color:#ffd84d;
  --color2:#ff9f43;
  --dark:#25263a;
  --soft:#fff7d6;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:20px;
  font-family:Arial,sans-serif;
  color:var(--dark);

  display:flex;
  justify-content:center;
  align-items:center;

  background:
    radial-gradient(circle at 15% 15%,rgba(255,255,255,.75),transparent 25%),
    linear-gradient(135deg,var(--soft),#eee9ff);
}

.fondo-bolas{
  position:fixed;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:-1;
}

.bola{
  position:absolute;
  border-radius:50%;
  filter:blur(1px);
  opacity:.23;
  box-shadow:
    inset -8px -10px 15px rgba(0,0,0,.12),
    inset 7px 7px 12px rgba(255,255,255,.55);
}

.b1{
  width:130px;
  height:130px;
  background:#ffd93d;
  top:5%;
  left:-30px;
}

.b2{
  width:90px;
  height:90px;
  background:#6bcB77;
  bottom:8%;
  right:3%;
}

.b3{
  width:70px;
  height:70px;
  background:#4d96ff;
  top:18%;
  right:8%;
}

.b4{
  width:110px;
  height:110px;
  background:#ff6b6b;
  bottom:-20px;
  left:12%;
}

.tarjeta{
  width:100%;
  max-width:520px;
  background:rgba(255,255,255,.96);
  border-radius:28px;
  padding:28px 24px;
  box-shadow:0 18px 50px rgba(37,38,58,.18);
  border:1px solid rgba(255,255,255,.8);
  text-align:center;
}

.mundo{
  font-size:12px;
  font-weight:800;
  letter-spacing:1.2px;
  text-transform:uppercase;
  color:var(--color2);
  text-align:left;
  margin-bottom:16px;
}

.icono{
  font-size:54px;
  line-height:1;
  margin:0 0 12px;
  filter:drop-shadow(0 5px 5px rgba(0,0,0,.15));
}

h1{
  font-size:28px;
  margin:0 0 10px;
}

.subtitulo{
  margin:0 0 20px;
  color:#707184;
  font-size:15px;
}

.pista{
  padding:20px;
  background:linear-gradient(135deg,var(--soft),#fff);
  border-left:5px solid var(--color);
  border-radius:16px;
  text-align:left;
  font-size:18px;
  line-height:1.6;
  white-space:pre-line;
  margin-bottom:18px;
}

input{
  width:100%;
  padding:15px;
  border:2px solid #dedee8;
  border-radius:13px;
  font-size:19px;
  text-align:center;
  outline:none;
  margin-bottom:12px;
}

input:focus{
  border-color:var(--color2);
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:15px;
  font-weight:800;
  font-size:16px;
  cursor:pointer;
  background:var(--dark);
  color:white;
}

button:hover{
  transform:translateY(-1px);
}

.resultado{
  display:none;
  margin-top:18px;
  padding:18px;
  border-radius:15px;
  line-height:1.6;
}

.correcto{
  display:block;
  background:#def7e4;
  color:#155d2b;
}

.incorrecto{
  display:block;
  background:#ffe0e0;
  color:#822;
}

.foto{
  display:none;
  width:100%;
  border-radius:18px;
  margin-top:18px;
  border:4px solid var(--soft);
}

.mini{
  font-size:13px;
  color:#777;
  margin-top:18px;
}

@media(max-width:420px){

  body{
    padding:12px;
  }

  .tarjeta{
    padding:24px 18px;
  }

  .pista{
    font-size:17px;
  }

}
</style>
</head>

<body>

<div class="fondo-bolas">
  <span class="bola b1"></span>
  <span class="bola b2"></span>
  <span class="bola b3"></span>
  <span class="bola b4"></span>
</div>

<main class="tarjeta">
  <p class="subtitulo">
    Parece que este recuerdo está bloqueado...
  </p>

  <section class="pista">

El Minion ha dejado una única pista para ayudarte.

Piensa bien antes de responder:

🪶 Un jefe indio.

🦜 Jack

¿Qué tienen en común?

Escribe una sola palabra para recuperar el recuerdo.

  </section>

  <input
    id="respuesta"
    type="text"
    placeholder="Escribe tu respuesta"
    autocomplete="off"
  >

  <button onclick="comprobar()">
    DESCIFRAR ESFERA
  </button>

  <div id="resultado" class="resultado"></div>

 <img
id="foto"
src="carnaval">

</main>

<script>

function normalizar(texto){

  return texto
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

}

function comprobar(){

  const valor =
  normalizar(
    document
      .getElementById("respuesta")
      .value
  );

  const resultado =
  document.getElementById(
    "resultado"
  );

  const foto =
  document.getElementById(
    "foto"
  );

  if(
      valor==="plumes"
      ||
      valor==="pluma"
  ){

      resultado.className =
      "resultado correcto";

      resultado.innerHTML =
      "✨ <strong>Esfera descifrada</strong><br><br>El recuerdo ha sido recuperado.";

      foto.style.display =
      "block";

  }else{

      resultado.className =
      "resultado incorrecto";

      resultado.innerHTML =
      "❌ Esa no es la palabra correcta.";

  }

}

document
.getElementById("respuesta")
.addEventListener(
"keydown",
e=>{

  if(e.key==="Enter"){
    comprobar();
  }

});

</script>

</body>
</html>
