<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Composició bloquejada</title>
<style>
:root{
  --color:#ffd84d;
  --color2:#ff9f43;
  --dark:#25263a;
  --soft:#fff7d6;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;touch-action:none}
body{
  min-height:100vh;
  padding:14px;
  font-family:Arial,sans-serif;
  color:var(--dark);
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 15% 15%,rgba(255,255,255,.75),transparent 25%),
    linear-gradient(135deg,var(--soft),#eee9ff);
}
.fondo-bolas{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.bola{position:absolute;border-radius:50%;filter:blur(1px);opacity:.23;box-shadow:inset -8px -10px 15px rgba(0,0,0,.12),inset 7px 7px 12px rgba(255,255,255,.55)}
.b1{width:130px;height:130px;background:#ffd93d;top:5%;left:-30px}
.b2{width:90px;height:90px;background:#6bcB77;bottom:8%;right:3%}
.b3{width:70px;height:70px;background:#4d96ff;top:18%;right:8%}
.b4{width:110px;height:110px;background:#ff6b6b;bottom:-20px;left:12%}
.tarjeta{
  width:100%;
  max-width:540px;
  background:rgba(255,255,255,.96);
  border-radius:28px;
  padding:24px 20px;
  box-shadow:0 18px 50px rgba(37,38,58,.18);
  border:1px solid rgba(255,255,255,.8);
  text-align:center;
}
h1{font-size:27px;margin:0 0 6px}
.subtitulo{margin:0 0 16px;color:#707184;font-size:15px}
#zonaJuego{transition:opacity .6s ease,transform .6s ease}
#lienzo{
  position:relative;
  width:100%;
  aspect-ratio:1;
  overflow:hidden;
  border-radius:18px;
  background:#f4f0e8;
  border:4px solid #fff1b8;
  box-shadow:inset 0 0 25px rgba(37,38,58,.12);
  touch-action:none;
}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#guia{pointer-events:none;opacity:.15}
#pintura{cursor:crosshair}
#rodillo{
  position:absolute;
  width:76px;
  height:28px;
  border-radius:8px;
  background:var(--pintura,#d73c36);
  border:4px solid rgba(255,255,255,.88);
  box-shadow:0 7px 16px rgba(0,0,0,.3);
  transform:translate(-50%,-50%) rotate(-8deg);
  pointer-events:none;
  opacity:0;
  z-index:8;
}
#rodillo:after{
  content:"";
  position:absolute;
  width:8px;
  height:42px;
  right:-13px;
  top:13px;
  border-radius:5px;
  background:#72798a;
  transform:rotate(-25deg);
  transform-origin:top;
}
#rodillo:before{
  content:"";
  position:absolute;
  width:25px;
  height:9px;
  right:-32px;
  top:46px;
  border-radius:8px;
  background:#25263a;
  transform:rotate(-25deg);
}
#rodillo.visible{opacity:1}
.etapa{
  margin:14px 0 10px;
  padding:12px 14px;
  border-radius:14px;
  background:linear-gradient(135deg,#fff7d6,#fff);
  font-weight:800;
}
.indicador{display:flex;justify-content:center;gap:12px;margin-top:12px}
.paso{
  width:35px;height:35px;border-radius:50%;display:grid;place-items:center;
  border:3px solid #dadce6;background:white;font-weight:900;color:#8b8d99;
  transition:.3s;
}
.paso.activo{transform:scale(1.12);border-color:var(--tono);box-shadow:0 0 17px color-mix(in srgb,var(--tono) 55%,transparent);color:var(--tono)}
.paso.hecho{background:var(--tono);border-color:var(--tono);color:white}
#desxifrant{display:none;padding:18px;border-radius:15px;background:#fff0ad;color:#5c4700;font-weight:800;animation:pulso .8s ease-in-out infinite alternate}
#recordFinal{
  max-height:0;
  opacity:0;
  overflow:hidden;
  transform:translateY(18px) scale(.97);
  transition:max-height 1.8s ease,opacity 1.8s ease,transform 1.8s ease;
}
#recordFinal.visible{max-height:1000px;opacity:1;transform:translateY(0) scale(1)}
#recordFinal img{display:block;width:100%;height:auto;border-radius:18px;border:4px solid var(--soft);box-shadow:0 12px 30px rgba(37,38,58,.18)}
.record{margin-top:14px;font-size:20px;font-weight:900;color:var(--color2)}
@keyframes pulso{from{transform:scale(1);opacity:.78}to{transform:scale(1.02);opacity:1}}
@media(max-width:420px){.tarjeta{padding:20px 14px}h1{font-size:24px}.etapa{font-size:14px}}
</style>
</head>
<body>
<div class="fondo-bolas"><span class="bola b1"></span><span class="bola b2"></span><span class="bola b3"></span><span class="bola b4"></span></div>
<main class="tarjeta">
  <div id="zonaJuego">
    <h1>Composició bloquejada</h1>
    <p class="subtitulo">Aplica les capes de pintura en l'ordre correcte.</p>
    <div id="lienzo">
      <canvas id="guia"></canvas>
      <canvas id="pintura"></canvas>
      <div id="rodillo"></div>
    </div>
    <div id="etapa" class="etapa">1. Pinta la capa vermella</div>
    <div class="indicador">
      <div id="paso0" class="paso activo" style="--tono:#d83b36">1</div>
      <div id="paso1" class="paso" style="--tono:#171820">2</div>
      <div id="paso2" class="paso" style="--tono:#d7e4ef">3</div>
    </div>
  </div>

  <div id="desxifrant">🔮 Desxifrant el record...</div>

  <div id="recordFinal">
    <img src="universitat.jpg" alt="Record recuperat">
    <div class="record">✨ Record recuperat</div>
  </div>
</main>
<script>
const lienzo=document.getElementById('lienzo');
const guia=document.getElementById('guia');
const pintura=document.getElementById('pintura');
const g=guia.getContext('2d');
const p=pintura.getContext('2d');
const rodillo=document.getElementById('rodillo');
const etapaTexto=document.getElementById('etapa');

const colores=['#d83b36','#171820','#eef5fa'];
const nombres=['vermella','negra','blanca'];
const objetivos=[.72,.63,.50];
let etapa=0;
let pintando=false;
let ultimo=null;
let cobertura=[new Set(),new Set(),new Set()];
let ancho=0,alto=0,ratio=1;

function ajustar(){
  const r=lienzo.getBoundingClientRect();
  ratio=window.devicePixelRatio||1;
  ancho=r.width;alto=r.height;
  [guia,pintura].forEach(c=>{c.width=Math.round(ancho*ratio);c.height=Math.round(alto*ratio)});
  g.setTransform(ratio,0,0,ratio,0,0);
  p.setTransform(ratio,0,0,ratio,0,0);
  dibujarGuia();
}

function silueta(ctx,capa){
  const cx=ancho/2,cy=alto*.53;
  ctx.beginPath();
  if(capa===0){
    ctx.arc(cx,cy,Math.min(ancho,alto)*.38,0,Math.PI*2);
  }else if(capa===1){
    ctx.moveTo(cx,alto*.18);
    ctx.lineTo(ancho*.68,alto*.36);
    ctx.lineTo(ancho*.63,alto*.47);
    ctx.lineTo(ancho*.77,alto*.74);
    ctx.lineTo(ancho*.60,alto*.69);
    ctx.lineTo(cx,alto*.84);
    ctx.lineTo(ancho*.40,alto*.69);
    ctx.lineTo(ancho*.23,alto*.74);
    ctx.lineTo(ancho*.37,alto*.47);
    ctx.lineTo(ancho*.32,alto*.36);
    ctx.closePath();
  }else{
    ctx.moveTo(ancho*.40,alto*.39);
    ctx.quadraticCurveTo(cx,alto*.31,ancho*.60,alto*.39);
    ctx.lineTo(ancho*.57,alto*.47);
    ctx.quadraticCurveTo(cx,alto*.43,ancho*.43,alto*.47);
    ctx.closePath();
    ctx.moveTo(ancho*.42,alto*.58);
    ctx.lineTo(ancho*.48,alto*.55);
    ctx.lineTo(ancho*.45,alto*.64);
    ctx.closePath();
    ctx.moveTo(ancho*.58,alto*.58);
    ctx.lineTo(ancho*.52,alto*.55);
    ctx.lineTo(ancho*.55,alto*.64);
    ctx.closePath();
  }
}

function dibujarGuia(){
  g.clearRect(0,0,ancho,alto);
  g.save();
  g.strokeStyle='#25263a';g.lineWidth=3;g.setLineDash([8,8]);
  silueta(g,etapa);g.stroke();
  g.restore();
}

function dentroMascara(x,y,capa){
  p.save();
  silueta(p,capa);
  const ok=p.isPointInPath(x*ratio,y*ratio);
  p.restore();
  return ok;
}

function pintarLinea(x1,y1,x2,y2){
  p.save();
  p.beginPath();
  silueta(p,etapa);
  p.clip();
  p.strokeStyle=colores[etapa];
  p.lineWidth=Math.max(32,ancho*.11);
  p.lineCap='round';p.lineJoin='round';
  p.beginPath();p.moveTo(x1,y1);p.lineTo(x2,y2);p.stroke();
  p.restore();

  const pasos=Math.max(1,Math.ceil(Math.hypot(x2-x1,y2-y1)/12));
  for(let i=0;i<=pasos;i++){
    const x=x1+(x2-x1)*(i/pasos),y=y1+(y2-y1)*(i/pasos);
    if(dentroMascara(x,y,etapa)) cobertura[etapa].add(`${Math.round(x/14)}-${Math.round(y/14)}`);
  }
  comprobarCobertura();
}

function comprobarCobertura(){
  const estimados=[Math.max(70,ancho*alto/250),Math.max(50,ancho*alto/340),Math.max(25,ancho*alto/650)];
  if(cobertura[etapa].size>=estimados[etapa]*objetivos[etapa]) completarEtapa();
}

function completarEtapa(){
  document.getElementById('paso'+etapa).classList.remove('activo');
  document.getElementById('paso'+etapa).classList.add('hecho');
  etapa++;
  if(etapa===3){
    setTimeout(finalizar,450);
    return;
  }
  document.getElementById('paso'+etapa).classList.add('activo');
  etapaTexto.textContent=`${etapa+1}. Pinta la capa ${nombres[etapa]}`;
  rodillo.style.setProperty('--pintura',colores[etapa]);
  dibujarGuia();
}

function pos(e){const r=pintura.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function iniciar(e){if(etapa>=3)return;e.preventDefault();pintando=true;ultimo=pos(e);pintura.setPointerCapture(e.pointerId);moverRodillo(ultimo);pintarLinea(ultimo.x,ultimo.y,ultimo.x+.1,ultimo.y+.1)}
function mover(e){if(!pintando||etapa>=3)return;e.preventDefault();const ahora=pos(e);moverRodillo(ahora);pintarLinea(ultimo.x,ultimo.y,ahora.x,ahora.y);ultimo=ahora}
function terminar(){pintando=false;ultimo=null;rodillo.classList.remove('visible')}
function moverRodillo(pt){rodillo.style.left=pt.x+'px';rodillo.style.top=pt.y+'px';rodillo.classList.add('visible')}

function finalizar(){
  document.getElementById('zonaJuego').style.opacity='0';
  document.getElementById('zonaJuego').style.transform='scale(.97)';
  setTimeout(()=>{
    document.getElementById('zonaJuego').style.display='none';
    document.getElementById('desxifrant').style.display='block';
    setTimeout(()=>{
      document.getElementById('desxifrant').style.display='none';
      document.getElementById('recordFinal').classList.add('visible');
    },1400);
  },600);
}

pintura.addEventListener('pointerdown',iniciar);
pintura.addEventListener('pointermove',mover);
pintura.addEventListener('pointerup',terminar);
pintura.addEventListener('pointercancel',terminar);
window.addEventListener('resize',ajustar);
window.addEventListener('load',()=>{ajustar();rodillo.style.setProperty('--pintura',colores[0])});
</script>
</body>
</html>
