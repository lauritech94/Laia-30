<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Huellas de memoria</title>
<style>
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  overflow:hidden;
  background:radial-gradient(circle,#263757 0%,#0b1220 75%);
  touch-action:none;
}
body{min-height:100vh;display:grid;place-items:center;padding:18px}
#juego{
  position:relative;
  width:min(92vw,390px);
  aspect-ratio:1;
  overflow:hidden;
  border-radius:24px;
  background:#111827;
  box-shadow:0 20px 60px #000b,0 0 0 5px #ffffff10;
}
#foto{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
#particulas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
}
#revelado{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  opacity:0;
  transform:scale(.7);
  pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.08),transparent 65%);
}
#revelado span{
  width:95px;
  height:95px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#fff,#ffe66d 22%,#ff9f43 58%,#7c3aed);
  box-shadow:0 0 30px #ffe66d,0 0 75px #ff9f43aa;
}
#flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:20}
.completo #particulas{animation:desvanecer .75s ease forwards}
.completo #revelado{animation:aparecer .8s .25s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes desvanecer{to{opacity:0;transform:scale(1.15)}}
@keyframes aparecer{0%{opacity:0;transform:scale(.7)}65%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div id="juego">
  <img id="foto" src="foto.jpg" alt="">
  <canvas id="particulas"></canvas>
  <div id="revelado"><span></span></div>
</div>
<div id="flash"></div>
<script>
const juego=document.getElementById('juego');
const canvas=document.getElementById('particulas');
const ctx=canvas.getContext('2d');
let puntos=[];
let puntero={x:-999,y:-999,activo:false};
let completo=false;

function ajustar(){
  const r=canvas.getBoundingClientRect();
  const escala=window.devicePixelRatio||1;
  canvas.width=Math.round(r.width*escala);
  canvas.height=Math.round(r.height*escala);
  ctx.setTransform(escala,0,0,escala,0,0);
  crearParticulas(r.width,r.height);
}

function crearParticulas(ancho,alto){
  puntos=[];
  const cantidad=Math.round((ancho*alto)/430);
  const colores=['#eef6ff','#b8c7dc','#8fa4c1','#c8b8ff','#8ee9ff'];
  for(let i=0;i<cantidad;i++){
    puntos.push({
      x:Math.random()*ancho,
      y:Math.random()*alto,
      ox:0,
      oy:0,
      vx:0,
      vy:0,
      r:7+Math.random()*13,
      c:colores[Math.floor(Math.random()*colores.length)],
      a:.72+Math.random()*.25
    });
  }
}

function moverPuntero(e){
  const r=canvas.getBoundingClientRect();
  puntero.x=e.clientX-r.left;
  puntero.y=e.clientY-r.top;
}
canvas.addEventListener('pointerdown',e=>{
  puntero.activo=true;
  canvas.setPointerCapture(e.pointerId);
  moverPuntero(e);
});
canvas.addEventListener('pointermove',e=>{
  if(puntero.activo)moverPuntero(e);
});
canvas.addEventListener('pointerup',()=>puntero.activo=false);
canvas.addEventListener('pointercancel',()=>puntero.activo=false);

function animar(){
  const r=canvas.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);
  let fuera=0;

  for(const p of puntos){
    if(puntero.activo){
      const dx=p.x-puntero.x;
      const dy=p.y-puntero.y;
      const d=Math.hypot(dx,dy)||1;
      const alcance=85;
      if(d<alcance){
        const fuerza=(alcance-d)/alcance;
        p.vx+=(dx/d)*fuerza*2.8;
        p.vy+=(dy/d)*fuerza*2.8;
      }
    }

    p.vx*=.94;
    p.vy*=.94;
    p.x+=p.vx;
    p.y+=p.vy;

    if(p.x<-25||p.x>r.width+25||p.y<-25||p.y>r.height+25){
      fuera++;
      continue;
    }

    ctx.globalAlpha=p.a;
    ctx.fillStyle=p.c;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }

  if(!completo&&fuera>puntos.length*.58){
    completo=true;
    juego.classList.add('completo');
    document.getElementById('flash').animate(
      [{opacity:0},{opacity:.8},{opacity:0}],
      {duration:520}
    );
    if(navigator.vibrate)navigator.vibrate([45,25,80]);
  }

  requestAnimationFrame(animar);
}

window.addEventListener('resize',ajustar);
window.addEventListener('load',()=>{ajustar();animar()});
</script>
</body>
</html>
