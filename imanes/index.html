<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imanes V2</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111827;font-family:Arial,sans-serif;touch-action:none}
#juego{position:relative;width:100vw;height:100vh;overflow:hidden}
.iman{
  position:absolute;
  width:88px;
  height:88px;
  margin:0;
  padding:0;
  border:3px solid rgba(255,255,255,.25);
  border-radius:22px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:46px;
  background:linear-gradient(145deg,#ffffff,#dfe7f2);
  box-shadow:0 10px 24px rgba(0,0,0,.35),inset 0 0 0 2px rgba(255,255,255,.45);
  cursor:grab;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
  transform:translate(-50%,-50%);
  transition:box-shadow .18s,filter .18s,transform .18s,left .28s cubic-bezier(.2,.9,.2,1),top .28s cubic-bezier(.2,.9,.2,1);
  z-index:3;
}
.iman.arrastrando{cursor:grabbing;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 18px 34px rgba(0,0,0,.5);z-index:20}
.iman.cerca{box-shadow:0 0 22px #78eaff,0 0 55px #4f7cff99;filter:brightness(1.11)}
.iman.unido{background:linear-gradient(145deg,#e9fff0,#bdf6cf);border-color:#50d17b;box-shadow:0 0 20px #50d17b99,0 9px 22px rgba(0,0,0,.35);cursor:default}
.puente{position:absolute;height:12px;border-radius:999px;background:linear-gradient(90deg,#50d17b,#d7ffe3,#50d17b);box-shadow:0 0 15px #50d17baa;transform-origin:left center;z-index:2;pointer-events:none;opacity:0;transition:opacity .25s}
.puente.visible{opacity:1}
#victoria{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;z-index:40;background:rgba(8,12,22,.08)}
#orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#ffe66d 22%,#ff9f43 58%,#7c3aed);box-shadow:0 0 45px #ffe66d,0 0 120px #ff9f43aa;transform:scale(.25)}
#victoria.mostrar{animation:mostrarFondo .6s forwards}
#victoria.mostrar #orb{animation:mostrarOrb .8s cubic-bezier(.2,.9,.2,1) forwards}
#flash{position:fixed;inset:0;background:white;opacity:0;pointer-events:none;z-index:99}
@keyframes mostrarFondo{to{opacity:1}}
@keyframes mostrarOrb{0%{transform:scale(.25)}65%{transform:scale(1.15)}100%{transform:scale(1)}}
@media(max-width:520px){.iman{width:76px;height:76px;font-size:40px}}
</style>
</head>
<body>
<div id="juego">
  <div id="vespa" class="iman" data-pareja="cine" style="left:18%;top:22%;">🛵</div>
  <div id="cine" class="iman" data-pareja="vespa" style="left:76%;top:22%;">🎬</div>
  <div id="amor" class="iman" data-pareja="pingu" style="left:22%;top:50%;">❤️</div>
  <div id="pingu" class="iman" data-pareja="amor" style="left:78%;top:50%;">🐧</div>
  <div id="arte" class="iman" data-pareja="flores" style="left:18%;top:78%;">🎨</div>
  <div id="flores" class="iman" data-pareja="arte" style="left:76%;top:78%;">🌸</div>

  <div id="puente1" class="puente"></div>
  <div id="puente2" class="puente"></div>
  <div id="puente3" class="puente"></div>

  <div id="victoria"><div id="orb"></div></div>
</div>
<div id="flash"></div>
<script>
const juego=document.getElementById('juego');
const piezas=[...document.querySelectorAll('.iman')];
const parejasUnidas=new Set();
let activa=null;
let offsetX=0;
let offsetY=0;
let candidata=null;

function centro(el){
  const r=el.getBoundingClientRect();
  return{x:r.left+r.width/2,y:r.top+r.height/2};
}

function distancia(a,b){
  const ca=centro(a),cb=centro(b);
  return Math.hypot(ca.x-cb.x,ca.y-cb.y);
}

function limitar(x,y,el){
  const r=el.getBoundingClientRect();
  const mitadX=r.width/2,mitadY=r.height/2;
  return{
    x:Math.max(mitadX,Math.min(window.innerWidth-mitadX,x)),
    y:Math.max(mitadY,Math.min(window.innerHeight-mitadY,y))
  };
}

function limpiarCandidata(){
  piezas.forEach(p=>p.classList.remove('cerca'));
  candidata=null;
}

function evaluarCercania(){
  limpiarCandidata();
  if(!activa)return;
  const pareja=document.getElementById(activa.dataset.pareja);
  if(!pareja||pareja.classList.contains('unido'))return;
  if(distancia(activa,pareja)<145){
    activa.classList.add('cerca');
    pareja.classList.add('cerca');
    candidata=pareja;
  }
}

function unir(a,b){
  const ca=centro(a),cb=centro(b);
  const mitad={x:(ca.x+cb.x)/2,y:(ca.y+cb.y)/2};
  const separacion=50;

  a.style.left=(mitad.x-separacion)+'px';
  a.style.top=mitad.y+'px';
  b.style.left=(mitad.x+separacion)+'px';
  b.style.top=mitad.y+'px';

  a.classList.remove('arrastrando','cerca');
  b.classList.remove('cerca');
  a.classList.add('unido');
  b.classList.add('unido');

  const clave=[a.id,b.id].sort().join('-');
  parejasUnidas.add(clave);
  dibujarPuentes();

  if(navigator.vibrate)navigator.vibrate([25,20,45]);
  if(parejasUnidas.size===3)victoria();
}

function dibujarPuentes(){
  const pares=[['vespa','cine'],['amor','pingu'],['arte','flores']];
  pares.forEach((par,i)=>{
    const a=document.getElementById(par[0]);
    const b=document.getElementById(par[1]);
    const puente=document.getElementById('puente'+(i+1));
    if(!a.classList.contains('unido'))return;
    const ca=centro(a),cb=centro(b);
    const dx=cb.x-ca.x,dy=cb.y-ca.y;
    const longitud=Math.hypot(dx,dy);
    const angulo=Math.atan2(dy,dx)*180/Math.PI;
    puente.style.left=ca.x+'px';
    puente.style.top=(ca.y-6)+'px';
    puente.style.width=longitud+'px';
    puente.style.transform=`rotate(${angulo}deg)`;
    puente.classList.add('visible');
  });
}

function comenzar(e){
  const el=e.currentTarget;
  if(el.classList.contains('unido'))return;
  e.preventDefault();
  activa=el;
  activa.classList.add('arrastrando');
  activa.setPointerCapture(e.pointerId);
  const c=centro(activa);
  offsetX=e.clientX-c.x;
  offsetY=e.clientY-c.y;
}

function mover(e){
  if(!activa)return;
  e.preventDefault();
  const p=limitar(e.clientX-offsetX,e.clientY-offsetY,activa);
  activa.style.left=p.x+'px';
  activa.style.top=p.y+'px';
  evaluarCercania();
}

function soltar(e){
  if(!activa)return;
  e.preventDefault();
  const a=activa;
  const b=candidata;
  a.classList.remove('arrastrando');
  limpiarCandidata();
  activa=null;
  if(b)unir(a,b);
}

function victoria(){
  document.getElementById('victoria').classList.add('mostrar');
  document.getElementById('flash').animate(
    [{opacity:0},{opacity:.9},{opacity:0}],
    {duration:560}
  );
}

piezas.forEach(p=>{
  p.addEventListener('pointerdown',comenzar);
  p.addEventListener('pointermove',mover);
  p.addEventListener('pointerup',soltar);
  p.addEventListener('pointercancel',soltar);
});

window.addEventListener('resize',dibujarPuentes);
</script>
</body>
</html>
