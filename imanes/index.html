<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Imanes</title>

<style>

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    background:#111827;
    font-family:Arial;
}

.iman{

    position:absolute;

    width:90px;
    height:90px;

    border-radius:20px;

    background:white;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:48px;

    cursor:grab;

    user-select:none;

    box-shadow:
    0 4px 15px rgba(0,0,0,.3);
}

.bloqueado{

    background:#dfffe5;

    border:4px solid #4caf50;
}

#mensaje{

    position:fixed;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    color:white;

    font-size:28px;

    opacity:0;
}

.mostrar{
    opacity:1 !important;
}

</style>

</head>
<body>

<div id="vespa" class="iman" style="left:80px;top:100px;">
🛵
</div>

<div id="cine" class="iman" style="left:300px;top:100px;">
🎬
</div>

<div id="amor" class="iman" style="left:80px;top:300px;">
❤️
</div>

<div id="pingu" class="iman" style="left:300px;top:300px;">
🐧
</div>

<div id="arte" class="iman" style="left:80px;top:500px;">
🎨
</div>

<div id="flores" class="iman" style="left:300px;top:500px;">
🌸
</div>

<div id="mensaje">
✨ COMPLETADO ✨
</div>

<script>

const parejas = {

    vespa : "cine",
    cine : "vespa",

    amor : "pingu",
    pingu : "amor",

    arte : "flores",
    flores : "arte"
};

let parejasHechas = 0;

document
.querySelectorAll(".iman")
.forEach(activar);

function activar(el){

    let moviendo = false;

    let dx = 0;
    let dy = 0;

    el.addEventListener("pointerdown",e=>{

        if(el.classList.contains("bloqueado"))
            return;

        moviendo = true;

        const r =
        el.getBoundingClientRect();

        dx = e.clientX - r.left;
        dy = e.clientY - r.top;

        el.setPointerCapture(
        e.pointerId
        );

    });

    el.addEventListener("pointermove",e=>{

        if(!moviendo)
            return;

        el.style.left =
        (e.clientX - dx) + "px";

        el.style.top =
        (e.clientY - dy) + "px";

        revisar(el);

    });

    el.addEventListener("pointerup",()=>{

        moviendo = false;

    });

}

function revisar(a){

    const pareja =
    document.getElementById(
    parejas[a.id]
    );

    if(
        a.classList.contains("bloqueado")
        ||
        pareja.classList.contains("bloqueado")
    ){
        return;
    }

    const ax =
    parseInt(a.style.left);

    const ay =
    parseInt(a.style.top);

    const bx =
    parseInt(pareja.style.left);

    const by =
    parseInt(pareja.style.top);

    const distancia =
    Math.hypot(
        ax-bx,
        ay-by
    );

    if(distancia < 100){

        const mx =
        (ax+bx)/2;

        const my =
        (ay+by)/2;

        a.style.left =
        (mx-50)+"px";

        pareja.style.left =
        (mx+50)+"px";

        a.style.top =
        my+"px";

        pareja.style.top =
        my+"px";

        a.classList.add(
        "bloqueado"
        );

        pareja.classList.add(
        "bloqueado"
        );

        parejasHechas++;

        if(parejasHechas===3){

            document
            .getElementById(
            "mensaje"
            )
            .classList.add(
            "mostrar"
            );

        }

    }

}

</script>

</body>
</html>
