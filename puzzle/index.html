<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle de recuerdo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 18px;
      background: linear-gradient(145deg, #0d1526, #202b49);
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      width: 100%;
      max-width: 430px;
      padding: 22px;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      overflow: hidden;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(30px, 8vw, 46px);
      line-height: 1.14;
    }

    .sub {
      margin: 0 0 18px;
      color: #dbe5ff;
      line-height: 1.45;
      font-size: clamp(16px, 4.5vw, 21px);
    }

    #puzzle {
      --n: 3;
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(var(--n), minmax(0, 1fr));
      grid-template-rows: repeat(var(--n), minmax(0, 1fr));
      gap: 3px;
      padding: 3px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 15px;
      overflow: hidden;
      touch-action: manipulation;
    }

    .pieza {
      width: 100%;
      min-width: 0;
      min-height: 0;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("foto.jpg");
      background-repeat: no-repeat;
      cursor: pointer;
    }

    .pieza.sel {
      outline: 4px solid #ffe66d;
      outline-offset: -4px;
      filter: brightness(1.15);
    }

    #mensaje {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      background: #dff8e6;
      color: #195a2c;
      font-weight: bold;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>🧠 Recuerdo fragmentado</h1>

    <p class="sub">
      Reconstruye la fotografía.<br>
      Toca dos piezas para intercambiarlas.
    </p>

    <div id="puzzle" aria-label="Puzzle de nueve piezas"></div>

    <div id="mensaje">
      ✨ RECUERDO RECUPERADO ✨<br>
      La fotografía vuelve a estar completa.
    </div>
  </main>

  <script>
    const N = 3;
    const total = N * N;
    const ordenCorrecto = Array.from({ length: total }, (_, i) => i);

    let piezas = [...ordenCorrecto];
    let seleccionada = null;

    const puzzle = document.getElementById("puzzle");
    const mensaje = document.getElementById("mensaje");

    puzzle.style.setProperty("--n", N);

    function mezclar() {
      do {
        for (let i = piezas.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [piezas[i], piezas[j]] = [piezas[j], piezas[i]];
        }
      } while (piezas.every((valor, indice) => valor === indice));
    }

    function estaResuelto() {
      return piezas.every((valor, indice) => valor === indice);
    }

    function dibujar() {
      puzzle.innerHTML = "";

      piezas.forEach((valor, indice) => {
        const pieza = document.createElement("button");
        const columna = valor % N;
        const fila = Math.floor(valor / N);

        pieza.type = "button";
        pieza.className = "pieza" + (seleccionada === indice ? " sel" : "");

        pieza.style.backgroundSize = `${N * 100}% ${N * 100}%`;
        pieza.style.backgroundPosition =
          `${(columna * 100) / (N - 1)}% ${(fila * 100) / (N - 1)}%`;

        pieza.setAttribute("aria-label", `Pieza ${indice + 1}`);
        pieza.addEventListener("click", () => seleccionar(indice));

        puzzle.appendChild(pieza);
      });

      mensaje.style.display = estaResuelto() ? "block" : "none";
    }

    function seleccionar(indice) {
      if (seleccionada === null) {
        seleccionada = indice;
        dibujar();
        return;
      }

      if (seleccionada === indice) {
        seleccionada = null;
        dibujar();
        return;
      }

      [piezas[seleccionada], piezas[indice]] =
        [piezas[indice], piezas[seleccionada]];

      seleccionada = null;
      dibujar();
    }

    mezclar();
    dibujar();
  </script>
</body>
</html>
