<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Objeto oculto</title>

<style>

body{
    margin:0;
    background:#111827;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial,sans-serif;
    color:white;
}

.card{
    width:100%;
    max-width:500px;
    padding:20px;
    text-align:center;
}

img{
    width:100%;
    border-radius:20px;
    cursor:pointer;
}

#mensaje{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

.correcto{
    color:#8dff8d;
}

.incorrecto{
    color:#ffb3b3;
}

</style>

</head>

<body>

<div class="card">

<h1>🍌 Recuerdo alterado</h1>

<p>
Alguien ha escondido algo que no pertenece a este recuerdo.

Encuentra la banana.
</p>

<img
id="foto"
src="foto.jpg"
alt="Objeto oculto">

<div id="mensaje"></div>

</div>

<script>

const foto =
document.getElementById("foto");
alert("foto encontrada");
foto.addEventListener("click", function(e){
alert("click");
    const rect =
        foto.getBoundingClientRect();

    const x =
        (e.clientX - rect.left)
        /
        rect.width;

    const y =
        (e.clientY - rect.top)
        /
        rect.height;

    // BANANA

    const objetivoX = 0.73;
    const objetivoY = 0.81;

    const radio = 0.12;

    const distancia =
        Math.sqrt(
            Math.pow(x - objetivoX, 2)
            +
            Math.pow(y - objetivoY, 2)
        );

    if(distancia < radio){

        document
        .getElementById("mensaje")
        .innerHTML =
        `
        <span class="correcto">
        ✨ RECUERDO RECUPERADO ✨
        <br><br>
        Algunas pistas aparecen donde menos las esperas.
        </span>
        `;

    }else{

        document
        .getElementById("mensaje")
        .innerHTML =
        `
        <span class="incorrecto">
        ❌ Sigue buscando...
        </span>
        `;

    }

});

</script>

</body>
</html>
